<!DOCTYPE html>
<html>
<head>
    <title>Live Auction</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="text-align: center; font-family: Arial; padding-top: 50px; background: #f4f4f4;">
    <h2>Live Auction Platform (Real-time Architecture)</h2>
    <div style="background: white; width: 300px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px #ccc;">
        <h3>Current Highest Bid:</h3>
        <h1 style="color: green;">$<span id="bid">100</span></h1>
        <input type="number" id="bidAmount" placeholder="Enter your bid" style="padding: 10px; width: 80%;">
        <br><br>
        <button onclick="sendBid()" style="padding: 10px 20px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer;">Place Bid</button>
    </div>
    <script>
        const socket = io();
        socket.on('updateBid', (price) => { document.getElementById('bid').innerText = price; });
        function sendBid() {
            const amt = parseInt(document.getElementById('bidAmount').value);
            if(amt) socket.emit('placeBid', amt);
        }
    </script>
</body>
</html>
